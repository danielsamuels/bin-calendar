name: "Deploy"
on:
  push:
    branches:
      - master
  schedule:
    - cron: '18 7 */5 * *'

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: bin-calendar

    steps:
      - name: Checkout repository
        uses: actions/checkout@master

      - name: Build .ics file
        run: |
          mkdir -p output
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          python3 generate_ics.py

        env:
          OUTPUT_FILENAME: output/index.html
          UPRN: ${{ secrets.UPRN }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}

      - name: Verify calendar has events
        run: |
          echo "=== Generated calendar content ==="
          cat output/index.html
          echo ""
          echo "=== File size ==="
          wc -c output/index.html
          if ! grep -q "^BEGIN:VEVENT" output/index.html; then
            echo "ERROR: Calendar contains no events — AUTH_TOKEN may have expired."
            exit 1
          fi
          echo "Calendar OK: $(grep -c '^BEGIN:VEVENT' output/index.html) event(s) found."

      - name: Archive calendar file
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: output/
          retention-days: 14

  deploy:
    needs: build

    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
