name: "Deploy"
on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: '18 7 */5 * *'

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: bin-calendar

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build .ics file
        run: |
          mkdir -p output
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          python3 generate_ics.py

        env:
          OUTPUT_FILENAME: output/index.html
          UPRN: ${{ secrets.UPRN }}

      - name: Verify calendar has events
        run: |
          count=$(grep -c "^BEGIN:VEVENT" output/index.html || true)
          if [ "$count" -eq 0 ]; then
            echo "ERROR: Calendar contains no events"
            cat output/index.html
            exit 1
          fi
          echo "Calendar OK: $count event(s) found"

      - name: Archive calendar file
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: output/
          retention-days: 14

      # GitHub disables scheduled workflows in public repositories after 60 days
      # with no repository activity, so push the generated calendar back to the
      # repo to keep the schedule alive. When the collection dates haven't
      # changed there is nothing to commit, so fall back to an empty commit once
      # we get close to the cutoff. Pushes made with GITHUB_TOKEN don't trigger
      # workflows, so this can't loop despite the push trigger above.
      - name: Commit calendar
        if: github.ref == 'refs/heads/master'
        run: |
          cp output/index.html bin-calendar.ics
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin-calendar.ics

          if git diff --cached --quiet; then
            age=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
            echo "Collection dates unchanged (last commit ${age} day(s) ago)"
            if [ "$age" -lt 45 ]; then
              echo "Nothing to do"
              exit 0
            fi
            git commit --allow-empty -m "Keepalive: prevent scheduled workflow suspension"
          else
            git commit -m "Update bin collection dates"
          fi

          git push origin HEAD:master || {
            echo "Push rejected, rebasing onto latest master and retrying"
            git pull --rebase origin master
            git push origin HEAD:master
          }

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'

    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4